name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Prepare Python test results
        run: mkdir -p test-results
      - name: Run Python tests
        run: python -m pytest --junitxml=test-results/pytest.xml
      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-results-${{ github.sha }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Prepare frontend test results
        working-directory: frontend
        run: mkdir -p test-results
      - working-directory: frontend
        run: npm run test:title-index -- --test-reporter=junit --test-reporter-destination=test-results/title-index.xml
      - working-directory: frontend
        run: npm run test:tmdb -- --test-reporter=junit --test-reporter-destination=test-results/tmdb.xml
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run format:check
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run scan:secrets
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-results-${{ github.sha }}
          path: frontend/test-results/*.xml
          if-no-files-found: warn
          retention-days: 30
