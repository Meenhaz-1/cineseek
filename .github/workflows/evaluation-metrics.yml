name: Evaluation metrics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Movie search benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Fetch pinned production data release
        working-directory: frontend
        run: node scripts/fetch-runtime-data.mjs
        env:
          CINESEEK_DATA_RELEASE: ${{ vars.CINESEEK_DATA_RELEASE }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      - name: Generate benchmark run
        working-directory: frontend
        run: >-
          npm run benchmark:title --
          --corpus .runtime-data/corpus.enriched.jsonl
          --registry .runtime-data/planner-registry.json
          --queries .runtime-data/benchmark-queries.jsonl
          --output ../outputs/query-planner-migration/unified-planner.run.jsonl

      - name: Evaluate the production search pipeline
        run: >-
          python -m cineseek evaluate .
          outputs/query-planner-migration/unified-planner.run.jsonl
          --corpus frontend/.runtime-data/corpus.enriched.jsonl
          --queries frontend/.runtime-data/benchmark-queries.jsonl
          --qrels frontend/.runtime-data/benchmark-qrels.tsv
          --k 10
          --recall-k 100
          --output outputs/post-merge-evaluation/report.json

      - name: Publish metrics to the workflow summary
        run: >-
          node frontend/scripts/write-evaluation-summary.mjs
          outputs/post-merge-evaluation/report.json

      - name: Enforce benchmark regression policy
        working-directory: frontend
        run: node scripts/assert-benchmark-regression.mjs ../outputs/post-merge-evaluation/report.json

      - name: Retain the benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-metrics-${{ github.sha }}
          path: |
            outputs/query-planner-migration/unified-planner.run.jsonl
            outputs/post-merge-evaluation/report.json
          if-no-files-found: error
          retention-days: 30
